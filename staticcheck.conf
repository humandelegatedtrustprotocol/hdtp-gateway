# ST1005 forbids error strings that are capitalised or end in punctuation, on the
# assumption they get wrapped into longer sentences. This codebase deliberately
# writes multi-sentence diagnostics that tell an operator what to DO next
# ("... an archive run did not finish. Run `audit repair`."), which is worth more
# than the wrapping convention. Everything else stays at staticcheck's defaults.
checks = ["inherit", "-ST1005"]
