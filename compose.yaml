# hdtp-gateway (SPEC §12.4). First run: `docker compose up` — the logs print the
# portal URL and a one-time setup token. The portal binds loopback INSIDE the
# container: a non-loopback bind needs a passkey host, auth and TLS (SPEC §8.3),
# which a first run has not got. The container healthcheck exercises the portal,
# over TLS when internal TLS is configured.
# The node's limits sidecar runs beside it (`limitd`, SPEC §5.7): until it answers, the node refuses
# every sealed call. Both run the published image (`make image`, RELEASING.md), pulled from ghcr.io;
# HDTP_IMAGE names another. To build the image from this checkout instead, `make limitd-vendor`, then
# `docker compose -f compose.yaml -f compose.build.yaml up -d --build` (compose.build.yaml says why).
# Optional profiles: `postgres` (external store), `cloudflared` (edge adapter), `ngrok` and `bore`
# (tunnel sidecars; docs/quickstart.md § 4 says what the node needs beside each).
services:
  # Named volumes are created root-owned and ownership propagation from the image
  # is not reliable across Docker variants; this one-shot init hands /data to the
  # distroless nonroot uid (65532). The -full image (Dockerfile.full) runs as the same uid.
  init-data:
    image: alpine:3.20
    command: ["chown", "65532:65532", "/data"]
    volumes:
      - hdtp-data:/data
    restart: "no"

  hdtp-gateway:
    image: "${HDTP_IMAGE:-ghcr.io/humandelegatedtrustprotocol/hdtp-gateway:0.3.0}"
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - hdtp-data:/data
    ports:
      # ONLY host loopback. The portal is plain HTTP here, which SPEC §8.3 allows on a loopback
      # bind only (any other bind needs TLS), and the forwarder below must not undo that:
      # "127.0.0.1:" is what keeps it off your LAN. Publishing "8080:8080" instead would put the
      # setup wizard and the sign-in, unencrypted, on your whole network. Port 8081 is the
      # forwarder, not the node.
      - "127.0.0.1:8080:8081"

  # The limits sidecar (SPEC §5.7): the same image, run as /hdtp-limitd with its shipped
  # configuration (deploy/limitd/limits.json, at /etc/hdtp-limitd/limits.json in the image), sharing
  # the /data volume its socket is in. It decides every call budget of every account; edit a copy of
  # that file and mount it over the shipped one to change a number.
  limitd:
    image: "${HDTP_IMAGE:-ghcr.io/humandelegatedtrustprotocol/hdtp-gateway:0.3.0}"
    restart: unless-stopped
    entrypoint: ["/hdtp-limitd"]
    command: ["-config", "/etc/hdtp-limitd/limits.json"]
    network_mode: none
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - hdtp-data:/data
    # The image's HEALTHCHECK asks the node's portal, which this container does not serve. This one
    # asks the sidecar itself for its rules, over the socket the node asks it on (HDTP_LIMITS_SOCKET,
    # else /data/limits.sock), with the binary the image has: distroless has no shell.
    healthcheck:
      test: ["CMD", "/hdtp-gateway", "healthcheck", "--limits"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  # The portal forwarder.
  #
  # The node binds its internal surface to the CONTAINER's loopback, and SPEC §8.3
  # refuses a non-loopback bind unless passkey auth and TLS are configured — which,
  # on first run, the owner cannot have yet, because registering the first passkey
  # is exactly what the wizard is for. So `docker compose up` used to print a
  # portal URL that nothing could reach, even with a published port.
  #
  # This sidecar shares the node's network namespace, so 127.0.0.1 here IS the
  # node's loopback. It forwards the published host-loopback port to it. The node's
  # guard is untouched: it still refuses to bind anywhere but loopback, and the
  # portal is still reachable only from this machine.
  portal:
    # Pinned by digest, the tag kept for the reader: `alpine/socat:latest` as resolved on 2026-10-08
    # (the multi-platform index; its images were built 2026-10-03).
    image: alpine/socat:latest@sha256:82ad20f6f6e29b91ff33b6662d24063522b1378f08fd8569cd3ab412cac13f50
    restart: unless-stopped
    network_mode: "service:hdtp-gateway"
    # The node's process namespace too, so the forwarder dies with the node and its restart policy
    # brings it back inside the node's NEW network. A restart the runtime makes (a crash,
    # `docker restart`) does not go through Compose, and the forwarder kept the old network, where
    # nothing listens, until it was restarted by hand (#204). With no capabilities, the forwarder's
    # root cannot signal or trace the node's processes, which run as another user.
    pid: "service:hdtp-gateway"
    cap_drop: [ALL]
    # restart: Compose restarts the forwarder whenever Compose restarts the node: it shares the
    # node's network, and after `docker compose restart hdtp-gateway` it answered nothing until it
    # was restarted too (#169).
    depends_on:
      hdtp-gateway:
        condition: service_started
        restart: true
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:127.0.0.1:8080"]

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hdtp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # REQUIRED when running the postgres profile
      POSTGRES_DB: hdtp
    volumes:
      - hdtp-pg:/var/lib/postgresql/data

  cloudflared:
    profiles: ["cloudflared"]
    # Pinned by digest, the tag kept for the reader: `cloudflare/cloudflared:latest` as resolved on
    # 2026-10-08 (the multi-platform manifest list; its images were built 2026-10-05).
    image: cloudflare/cloudflared:latest@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # REQUIRED when running the cloudflared profile

  # ngrok's agent, forwarding NGROK_URL (an ngrok domain, https://…) to the node's public listener on
  # this network. ngrok terminates TLS: the node runs on the `edge` tunnel adapter, chosen in the
  # portal (docs/quickstart.md § 4). The agent verifies the node's certificate only with
  # --upstream-tls-verify, so the node's own chain needs no flag. Pinned by digest, the tag kept for
  # the reader: `ngrok/ngrok:latest` as resolved on 2026-10-13 (the multi-platform manifest list).
  ngrok:
    profiles: ["ngrok"]
    image: ngrok/ngrok:latest@sha256:14d80d083e5b53145f416bbbd36238336c9de4016c43fd950eb2eb845670583b
    restart: unless-stopped
    depends_on:
      - hdtp-gateway
    command: ["http", "https://hdtp-gateway:8443", "--url", "${NGROK_URL:-}", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}  # REQUIRED when running the ngrok profile, with NGROK_URL

  # bore, forwarding port BORE_PORT of bore.pub to the node's public listener as raw TCP: the node
  # stays in direct mode and its public URL is https://bore.pub:BORE_PORT (docs/quickstart.md § 4).
  # Pinned by digest, the tag kept for the reader: `ekzhang/bore:latest` as resolved on 2026-10-13
  # (bore 0.6.0, the multi-platform index).
  bore:
    profiles: ["bore"]
    image: ekzhang/bore:latest@sha256:add9294ed874251ca1737f1d4e10a8681c3b885048888b3022cb327e4133c988
    restart: unless-stopped
    depends_on:
      - hdtp-gateway
    command: ["local", "8443", "--local-host", "hdtp-gateway", "--to", "bore.pub", "--port", "${BORE_PORT:-}"]  # BORE_PORT REQUIRED

volumes:
  hdtp-data:
  hdtp-pg:
