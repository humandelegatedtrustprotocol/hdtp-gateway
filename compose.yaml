# hdtp-gateway (SPEC §12.4). First run: `docker compose up` — the logs print the
# portal URL and a one-time setup token. The portal binds loopback INSIDE the
# container: a non-loopback bind needs a passkey host, auth and TLS (SPEC §8.3),
# which a first run has not got. The container healthcheck exercises the portal,
# over TLS when internal TLS is configured.
# The node's limits sidecar runs beside it (`limitd`, SPEC §5.7): until it answers, the node refuses
# every sealed call. `make identity-proxy limitd-vendor` first: the build reads the private
# identity module and the sidecar's crates from them.
# Optional profiles: `postgres` (external store), `cloudflared` (edge adapter).
services:
  # Named volumes are created root-owned and ownership propagation from the image
  # is not reliable across Docker variants; this one-shot init hands /data to the
  # distroless nonroot uid (65532). Using the -full image (user node, uid 1000)?
  # Change the chown target to 1000:1000.
  init-data:
    image: alpine:3.20
    command: ["chown", "65532:65532", "/data"]
    volumes:
      - hdtp-data:/data
    restart: "no"

  hdtp-gateway:
    # `make identity-proxy limitd-vendor` first: the build reads the private identity module and
    # the sidecar's crates from them (Dockerfile).
    build:
      context: .
      additional_contexts:
        identityproxy: ./.build/identity-proxy
        limitdvendor: ./.build/limitd-vendor
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - hdtp-data:/data
    ports:
      # ONLY host loopback. The portal has no login on a loopback bind (SPEC §8.3),
      # so it must not be reachable from your LAN — "127.0.0.1:" is what keeps it
      # off. Publishing "8080:8080" instead would expose an unauthenticated portal
      # to your whole network. Port 8081 is the forwarder below, not the node.
      - "127.0.0.1:8080:8081"

  # The limits sidecar (SPEC §5.7): the same image, run as /hdtp-limitd with its shipped
  # configuration (deploy/limitd/limits.json, at /etc/hdtp-limitd/limits.json in the image), sharing
  # the /data volume its socket is in. It decides every call budget of every account; edit a copy of
  # that file and mount it over the shipped one to change a number.
  limitd:
    build:
      context: .
      additional_contexts:
        identityproxy: ./.build/identity-proxy
        limitdvendor: ./.build/limitd-vendor
    restart: unless-stopped
    entrypoint: ["/hdtp-limitd"]
    command: ["-config", "/etc/hdtp-limitd/limits.json"]
    network_mode: none
    depends_on:
      init-data:
        condition: service_completed_successfully
    volumes:
      - hdtp-data:/data

  # The portal forwarder.
  #
  # The node binds its internal surface to the CONTAINER's loopback, and SPEC §8.3
  # refuses a non-loopback bind unless passkey auth and TLS are configured — which,
  # on first run, the owner cannot have yet, because registering the first passkey
  # is exactly what the wizard is for. So `docker compose up` used to print a
  # portal URL that nothing could reach, even with a published port.
  #
  # This sidecar shares the node's network namespace, so 127.0.0.1 here IS the
  # node's loopback. It forwards the published host-loopback port to it. The node's
  # guard is untouched: it still refuses to bind anywhere but loopback, and the
  # portal is still reachable only from this machine.
  portal:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: "service:hdtp-gateway"
    depends_on:
      hdtp-gateway:
        condition: service_started
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:127.0.0.1:8080"]

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hdtp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # REQUIRED when running the postgres profile
      POSTGRES_DB: hdtp
    volumes:
      - hdtp-pg:/var/lib/postgresql/data

  cloudflared:
    profiles: ["cloudflared"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}  # REQUIRED when running the cloudflared profile

volumes:
  hdtp-data:
  hdtp-pg:
