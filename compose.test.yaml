# Test-only Postgres for the store conformance suite:
#   docker compose -f compose.test.yaml up -d
#   HDTP_TEST_POSTGRES_DSN='postgres://hdtp:hdtp@localhost:54329/postgres?sslmode=disable' go test ./internal/core/store/
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdtp
      POSTGRES_PASSWORD: hdtp
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
