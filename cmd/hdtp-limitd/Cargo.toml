[package]
name = "hdtp-limitd"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "HDTP SPEC §12's per-caller call budgets for a hdtp-gateway node: one decision, one counter, shared by every node process on the host (layer 2 of docs/release/two-layer-limits-2026-09-28.md)"
publish = false

[[bin]]
name = "hdtp-limitd"
path = "src/main.rs"

[dependencies]
# The decision function, by released version: the same crate the cloud runs as Wasm, so the two
# hosts decide alike (hdtp-identity CHANGELOG 0.4.0; js/cases/limits-vectors.json).
pact-limits = { git = "ssh://git@github.com/pact-cloud/pact-identity.git", tag = "v0.4.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
